        - generic [ref=f2e29]:
          - heading "Brow mapping and design" [level=2] [ref=f2e30]
          - paragraph [ref=f2e31]: Small changes in brow structure can alter overall facial balance, which is why planning matters. At On Point Cosmetic Tattoo Studio in Buderim, I provide eyebrow tattoos for clients across the Sunshine Coast using structured mapping and technique selection.
          - paragraph [ref=f2e32]: Options include feather touch brows, microblading, nano realism hair strokes, powder brows and combination brows. During consultation, I assess natural brow growth, skin type, symmetry and pigment tone before recommending a suitable approach.
          - list [ref=f2e33]:
            - listitem [ref=f2e34]: Nano realism hair strokes
            - listitem [ref=f2e35]: Feather touch microblading
            - listitem [ref=f2e36]: Powder brows
            - listitem [ref=f2e37]: Combination brows
    - region [ref=f2e38]:
