        - generic [ref=f2e42]:
          - heading "Choosing the technique" [level=2] [ref=f2e43]
          - paragraph [ref=f2e44]: Different eyebrow tattoo techniques create different visual effects, so I explain each method clearly before proceeding. Hair stroke techniques, such as nano realism and microblading, create fine lines through manual or machine application. Powder brows use a soft shading method, while combination brows blend hair strokes with shading for added structure.
          - paragraph [ref=f2e45]: The chosen method depends on skin condition, previous tattoo work and personal preference. I'll outline preparation requirements, discuss healing stages and provide written aftercare guidance following treatment.
          - list [ref=f2e46]:
            - listitem [ref=f2e47]: Certified artist, with consultation protocols and hygiene standards suited to cosmetic tattoo
            - listitem [ref=f2e48]: Shape, proportion and pigment tone mapped to your features and reviewed before treatment
            - listitem [ref=f2e49]: Professional pigments and devices, with product details explained at your consultation
