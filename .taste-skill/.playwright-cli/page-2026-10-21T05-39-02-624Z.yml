          - generic [ref=f3e101]:
            - heading "Before your appointment" [level=3] [ref=f3e102]
            - list [ref=f3e103]:
              - listitem [ref=f3e104]: Avoid alcohol, coffee and non-prescribed blood thinners for 48 hours before.
              - listitem [ref=f3e105]: No tanning or excessive sun exposure in the week before.
              - listitem [ref=f3e106]: Do not use retinol on the area.
              - listitem [ref=f3e107]: Remove lash extensions before an eyeliner procedure.
              - listitem [ref=f3e108]: If you are prone to cold sores, seek medical advice before a lip procedure.
          - generic [ref=f3e109]:
            - heading "Straight afterwards" [level=3] [ref=f3e110]
            - list [ref=f3e111]:
              - listitem [ref=f3e112]: Mild redness, swelling, tenderness or flaking may occur.
              - listitem [ref=f3e113]: Colour appears darker immediately after treatment.
              - listitem [ref=f3e114]: A follow-up visit is usually scheduled six to eight weeks later.
          - generic [ref=f3e115]:
            - heading "While it heals" [level=3] [ref=f3e116]
            - list [ref=f3e117]:
              - listitem [ref=f3e118]: Apply the recommended cream as directed.
              - listitem [ref=f3e119]: Avoid exercise, swimming, spas and sun exposure during early healing.
              - listitem [ref=f3e120]: Do not pick or scratch the area.
              - listitem [ref=f3e121]: Avoid tweezing, tinting or waxing the area within 48 hours.
