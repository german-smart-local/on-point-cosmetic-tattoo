              - paragraph [ref=e91]: Eyeliner tattoos are considered semi-permanent. Longevity varies depending on skin type, pigment choice, sun exposure and lifestyle factors. Fading occurs gradually over time, and many people schedule maintenance appointments to refresh colour. Individual results differ, and healing response can influence how the pigment settles in the skin.
