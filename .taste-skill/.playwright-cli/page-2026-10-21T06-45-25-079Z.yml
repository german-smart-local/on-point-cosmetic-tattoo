            - heading "Mapping the lash line" [level=2] [ref=e33]
            - paragraph [ref=e34]: The lash line is one of the most precise areas of the face, which makes planning essential before any pigment is placed. At On Point Cosmetic Tattoo Studio in Buderim, I provide eyeliner tattoos for clients across the Sunshine Coast using structured mapping and controlled application methods.
            - paragraph [ref=e35]: Options include eyeliner enhancement and designer eyeliner, ranging from a fine line through the lashes to a more defined shape. During consultation, I review eye shape, lid space, skin condition and lifestyle considerations before outlining the proposed design.
            - generic [ref=e36]:
              - group "Techniques" [ref=e37]:
