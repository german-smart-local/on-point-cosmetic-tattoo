          - generic [ref=e46]:
            - heading "How the line is placed" [level=2] [ref=e47]
            - paragraph [ref=e48]: Eyeliner tattoos require careful placement due to the sensitivity of the eye area. I begin by mapping the lash line and discussing thickness, tapering and wing positioning where applicable. With eyeliner enhancement, I place subtle pigment within the lash line. For designer eyeliner, I create a more visible shape along the lid.
            - paragraph [ref=e49]: The selected method depends on anatomy, previous cosmetic tattoo work and personal preference. I outline preparation guidelines before the appointment and provide written aftercare instructions following treatment.
            - list [ref=e50]:
              - listitem [ref=e51]: Certified artist, with consultation protocols and hygiene standards suited to cosmetic tattoo
              - listitem [ref=e52]: Shape, proportion and pigment tone mapped to your features and reviewed before treatment
              - listitem [ref=e53]: Professional pigments and devices, with product details explained at your consultation
