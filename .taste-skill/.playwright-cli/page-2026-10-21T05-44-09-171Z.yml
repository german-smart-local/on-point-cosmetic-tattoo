              - heading "Before your appointment" [level=3] [ref=e103]
              - list [ref=e104]:
                - listitem [ref=e105]: Avoid alcohol, coffee and non-prescribed blood thinners for 48 hours before.
                - listitem [ref=e106]: No tanning or excessive sun exposure in the week before.
                - listitem [ref=e107]: Do not use retinol on the area.
                - listitem [ref=e108]: Remove lash extensions before an eyeliner procedure.
                - listitem [ref=e109]: If you are prone to cold sores, seek medical advice before a lip procedure.
            - generic [ref=e110]:
              - heading "Straight afterwards" [level=3] [ref=e111]
              - list [ref=e112]:
                - listitem [ref=e113]: Mild redness, swelling, tenderness or flaking may occur.
                - listitem [ref=e114]: Colour appears darker immediately after treatment.
                - listitem [ref=e115]: A follow-up visit is usually scheduled six to eight weeks later.
            - generic [ref=e116]:
              - heading "While it heals" [level=3] [ref=e117]
              - list [ref=e118]:
                - listitem [ref=e119]: Apply the recommended cream as directed.
                - listitem [ref=e120]: Avoid exercise, swimming, spas and sun exposure during early healing.
                - listitem [ref=e121]: Do not pick or scratch the area.
                - listitem [ref=e122]: Avoid tweezing, tinting or waxing the area within 48 hours.
