              - generic "How long do lip tattoos last?" [ref=e89] [cursor=pointer]
              - paragraph [ref=e92]: Lip tattoos are considered semi-permanent cosmetic procedures. Longevity varies depending on skin type, lifestyle, sun exposure and pigment choice. Fading happens gradually over time, and many people schedule maintenance appointments to refresh colour. Individual healing response and aftercare practices can influence how pigment settles in the lips.
