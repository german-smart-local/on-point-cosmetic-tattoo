          - generic [ref=e47]:
            - heading "The lip tattoo process" [level=2] [ref=e48]
            - paragraph [ref=e49]: Lip tattoos require thoughtful pigment selection and measured application due to the sensitivity of the area. I begin by mapping the lip border and reviewing colour tones suited to your natural base. Lip liner tattoo defines the edge, lip blend softens colour toward the centre and full lip tattoo distributes pigment across the entire lip area.
            - paragraph [ref=e50]: The chosen technique depends on previous tattoo work, skin response and personal preference discussed during consultation. I outline preparation guidelines before the appointment and provide written aftercare instructions following treatment.
            - list [ref=e51]:
              - listitem [ref=e52]: Certified artist, with consultation protocols and hygiene standards suited to cosmetic tattoo
              - listitem [ref=e53]: Shape, proportion and pigment tone mapped to your features and reviewed before treatment
              - listitem [ref=e54]: Professional pigments and devices, with product details explained at your consultation
